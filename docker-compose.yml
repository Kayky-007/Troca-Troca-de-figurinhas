# sobe o banco, o prometheus e o grafana
# os apps em node rodam direto na maquina (fora do docker)

services:
  mysql:
    image: mysql:8.4
    container_name: figurinhas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./banco:/docker-entrypoint-initdb.d
      - dados-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: figurinhas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml
    # pra conseguir acessar os apps que rodam no windows
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: figurinhas-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observabilidade/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  dados-mysql:
